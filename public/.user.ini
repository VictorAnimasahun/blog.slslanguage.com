; Raises the request-size limits enough for a blog post with a couple of
; inline images. The real fix for the "keeps failing to save" bug is that
; Quill's image button used to embed the picked photo as base64 straight
; into the post content instead of uploading it (see PostController's
; uploadImage() and the create/edit Quill handlers) -- a single ~6MB photo,
; base64-encoded, alone exceeded the previous 8M post_max_size, and Apache
; rejected the whole request with a bare 413 before Laravel ever saw it.
; This is a safety net on top of that fix, for a large real upload or
; someone pasting more than one image in.
;
; Respected by both mod_php and PHP-FPM/FastCGI (unlike .htaccess php_value,
; which FastCGI ignores) as long as the host allows .user.ini overrides --
; standard on shared/cPanel hosting. If it has no effect on live, raise the
; same two values in the hosting control panel's PHP settings instead.
post_max_size = 24M
upload_max_filesize = 20M
